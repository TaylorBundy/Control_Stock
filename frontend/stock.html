<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stock actual | Planillas Marce</title>
    <link rel="shortcut icon" href="./Imagenes/favicon.ico" />

    <link rel="stylesheet" href="stock.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="stock-header">
      <div class="brand">
        <div class="brand-icon">
          <img class="logo" src="./Imagenes/logo.avif" alt="Logo" />
        </div>
        <div><b>📦 Stock actual</b><small>YERBAS</small></div>
      </div>
      <!-- <h1>📦 Stock actual</h1> -->

      <button class="primary" id="refreshStock">
        <img
          class="agregar"
          src="./Imagenes/Iconos/actualizar.avif"
          alt="Logo"
        />↻ Actualizar
      </button>
    </header>

    <main class="stock-main" id="stock-main-id">
      <div class="stock-search-container">
        <input
          type="search"
          id="stockSearch"
          placeholder="Buscar código, marca o variedad..."
          autocomplete="off"
        />
      </div>

      <div class="stock-table-container">
        <table class="stock-table">
          <tbody id="stockBody">
            <tr>
              <td>Cargando stock...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Si index.html utiliza un archivo de configuración
         para definir window.API_BASE, cargarlo aquí también. -->
    <script src="config.js"></script>
    <script src="stock.js"></script>
    <!-- <script src="app.js"></script> -->
  </body>
</html>
